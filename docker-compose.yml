version: "3.9"

x-db-connection: &db-connection
  DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/cmms?sslmode=disable}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cmms}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    image: migrate/migrate:v4.17.0
    command:
      [
        "-path", "/migrations",
        "-database", "${DATABASE_URL:-postgres://postgres:postgres@db:5432/cmms?sslmode=disable}",
        "up"
      ]
    volumes:
      - ./database/schema:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-connection
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      <<: *db-connection
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
